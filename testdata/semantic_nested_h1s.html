<!DOCTYPE html>
<html>
<head>
    <title>Nested H1s Test</title>
</head>
<body>
    <nav>
        <a href="/home">Home</a>
    </nav>

    <h1>Top Level Title</h1>
    <p>Top level content.</p>

    <main>
        <article>
            <h1>Article Title</h1>
            <p>Article content paragraph 1.</p>
            <p>Article content paragraph 2.</p>

            <section>
                <h1>Section Title</h1>
                <p>Section content.</p>
            </section>
        </article>

        <aside>
            <p>Some sidebar content without headings.</p>
        </aside>
    </main>

    <footer>
        <p>Footer</p>
    </footer>
</body>
</html>
